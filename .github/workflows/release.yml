name: release

# 在 GitHub 上发布 release 时，打包三个平台的安装包并上传到该 release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # mac 两个架构都在 arm64 机器上打：electron-builder 会自己下载对应架构的 Electron
          - os: macos-14
            platform: mac
            arch: arm64
          - os: macos-14
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64

    steps:
      # 第三方 action 按 commit hash 固定，后面的注释是对应的版本
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # 用 npm install 而不是 npm ci：lock 里只记录了本机的 rollup / esbuild
      # 原生包，npm ci 在 Windows 上装不到 @rollup/rollup-win32-x64-msvc
      - run: npm install --no-audit --no-fund

      # 生成图标（脚本在非 darwin 上会自己跳过）
      - run: npm run assets

      - run: npm run typecheck

      - run: npx electron-vite build

      # --publish always 把产物传到触发这条流水线的 release
      - name: Package and upload to release
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 没有签名证书，别让 electron-builder 去找
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
